# Polynoia's controlled DeepSeek Harness ACP composition.
# The patched rc.8 ACP transport accepts exactly one client-supplied Polynoia
# MCP server. No Harness-native bash/fs/todo/job/skill/subagent tool is loaded.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: disabled
    reasoningEffort: off
    models:
      - id: __POLYNOIA_DSH_MODEL__

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: __POLYNOIA_DSH_MODEL__
    persistenceRoot: __POLYNOIA_DSH_PERSISTENCE_ROOT__
    persistenceCompression: zstd
    workspaceContext:
      maxBytes: 65536
    # Some compatible gateways omit tool-call ids. The controlled bridge
    # synthesizes ids, so calls are serialized for unambiguous correlation.
    maxParallelToolCalls: 1
    tools:
      mode: native
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: |
      You are a concise coding agent running inside Polynoia. Your working
      directory is {{cwd}}. Explain failures clearly, verify changes with
      focused tests, and never claim success without evidence.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 4096
    compactionRetries: 1
